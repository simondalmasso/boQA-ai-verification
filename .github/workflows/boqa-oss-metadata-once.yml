name: BOQA OSS Metadata One-Shot

on:
  push:
    branches:
      - chore/release-v1.4.0

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Update repository description and topics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl -fsS "${auth[@]}" -X PATCH "$api"             -d @- <<'JSON'
          {
            "description": "Open-source software verification infrastructure with bounded authority, deterministic replay, HumanGate, and reproducible evidence."
          }
          JSON

          curl -fsS "${auth[@]}" -X PUT "$api/topics"             -d @- <<'JSON'
          {
            "names": [
              "software-verification",
              "qa-automation",
              "developer-tools",
              "ai-agents",
              "human-in-the-loop",
              "deterministic-replay",
              "playwright",
              "ci-cd",
              "mcp",
              "software-testing",
              "evidence",
              "open-source"
            ]
          }
          JSON
