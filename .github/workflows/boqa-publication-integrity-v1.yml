name: BOQA Publication Integrity Gate V1

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  publication-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm

      - name: Reproducible install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=low

      - name: Publication integrity
        run: npm run check:publication

      - name: Verify bounded security-audit evidence
        run: node scripts/check-security-audit-evidence.js

      - name: Fixture-only CUORE demo
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run demo:cuore | tee /tmp/boqa-demo.log
          grep -F '"target_asset_network_requests": 0' /tmp/boqa-demo.log >/dev/null
          echo 'target_asset_network_requests=0'
