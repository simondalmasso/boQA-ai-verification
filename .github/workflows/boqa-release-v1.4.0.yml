name: BOQA Release V1.4.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'simondalmasso/boqa'
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p "require('./package.json').version")" = "1.4.0"
          grep -F 'APPLICATION_STATUS=READY' docs/openai-codex-oss/READINESS.md >/dev/null
          grep -F 'MODEL_OUTPUT != AUTHORIZATION' README.md >/dev/null
          grep -F 'Codex proposes.' README.md >/dev/null

      - name: Create canonical tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "RELEASE_ALREADY_EXISTS=YES"
            exit 0
          fi

          gh release create v1.4.0             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "BOQA v1.4.0 — Canonical OSS Release"             --notes "Initial canonical OSS release: lean kernel + CORE001 + OSS hardening + public landing. Exact-head Browser Smoke, Real Docker Qualification, Cloudflare preview and production verification; fixture-only CUORE demo with target_asset_network_requests=0; npm audit clean at release. MODEL_OUTPUT != AUTHORIZATION. Codex proposes. BOQA verifies."             --latest

      - name: Verify tag resolves to canonical SHA
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/tags/v1.4.0 | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          echo "RELEASE_TAG=v1.4.0"
          echo "RELEASE_SHA=$remote_sha"
