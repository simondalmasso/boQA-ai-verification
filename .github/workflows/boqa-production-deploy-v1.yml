name: BOQA Production Deploy V1

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact canonical main SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: boqa-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_NAME: boqa
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify exact main identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_main="$(git ls-remote https://github.com/${REPO}.git refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_SHA"
          echo "CANONICAL_MAIN_SHA=$EXPECTED_SHA"

      - name: Resolve exact-head preview evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          runs="$(curl -fsSL "${auth[@]}" "$api/actions/workflows/boqa-cloudflare-preview-v6.yml/runs?head_sha=$EXPECTED_SHA&status=success&per_page=20")"
          run_id="$(jq -r '.workflow_runs | map(select(.head_sha == env.EXPECTED_SHA and .conclusion == "success")) | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
          test -n "$run_id"

          artifacts="$(curl -fsSL "${auth[@]}" "$api/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_id="$(jq -r '.artifacts | map(select(.expired == false and (.name | startswith("boqa-cloudflare-preview-v6-")))) | sort_by(.created_at) | last | .id // empty' <<<"$artifacts")"
          test -n "$artifact_id"

          mkdir -p output/production-deploy/preview
          curl -fsSL -L "${auth[@]}" "$api/actions/artifacts/$artifact_id/zip" -o /tmp/preview.zip
          unzip -q /tmp/preview.zip -d output/production-deploy/preview

          candidate="$(find output/production-deploy/preview -name candidate.json -print -quit)"
          evidence="$(find output/production-deploy/preview -name preview-smoke-evidence.json -print -quit)"
          test -f "$candidate"
          test -f "$evidence"

          jq -e --arg sha "$EXPECTED_SHA" '
            .head_sha == $sha and
            .production_changed == false and
            .deploy_performed == false and
            (.version_id | type == "string") and
            (.preview_url | type == "string")
          ' "$candidate" >/dev/null

          jq -e '
            .gate_status == "PASS" and
            .static_publication_valid == true and
            .production_promotion_allowed == true and
            .production_changed == false and
            .deploy_performed == false
          ' "$evidence" >/dev/null

          {
            echo "PREVIEW_RUN_ID=$run_id"
            echo "PREVIEW_ARTIFACT_ID=$artifact_id"
            echo "PREVIEW_VERSION_ID=$(jq -r '.version_id' "$candidate")"
            echo "PREVIEW_URL=$(jq -r '.preview_url' "$candidate")"
          } >> "$GITHUB_ENV"

      - name: Snapshot deployment before
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?missing account id}"
          : "${CLOUDFLARE_API_TOKEN:?missing api token}"
          mkdir -p output/production-deploy
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$api/workers/scripts/$WORKER_NAME/deployments"             > output/production-deploy/deployments-before.json

      - name: Promote exact verified preview version
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PREVIEW_VERSION_ID"
          npx --yes wrangler@4.112.0 versions deploy "$PREVIEW_VERSION_ID@100%" --yes --config "$GITHUB_WORKSPACE/wrangler.toml"             | tee output/production-deploy/wrangler-versions-deploy.log

      - name: Verify production surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          prod="https://boqa.simondalmasso44.workers.dev"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"

          mkdir -p output/production-deploy/headers output/production-deploy/public

          for _ in $(seq 1 30); do
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$api/workers/scripts/$WORKER_NAME/deployments"               > output/production-deploy/deployments-after.json
            deployed_version="$(jq -r '.result.deployments[0].versions[0].version_id // empty' output/production-deploy/deployments-after.json)"
            if [ "$deployed_version" = "$PREVIEW_VERSION_ID" ]; then
              break
            fi
            sleep 2
          done

          deployed_version="$(jq -r '.result.deployments[0].versions[0].version_id // empty' output/production-deploy/deployments-after.json)"
          test "$deployed_version" = "$PREVIEW_VERSION_ID"

          fetch_public() {
            name="$1"
            url="$2"
            curl -fsS -D "output/production-deploy/headers/$name.txt" "$url" -o "output/production-deploy/public/$name"
          }

          assert_public_headers() {
            file="$1"
            grep -qi '^strict-transport-security: max-age=31536000; includeSubDomains' "$file"
            grep -qi '^content-security-policy:.*default-src.*self' "$file"
            grep -qi '^content-security-policy:.*frame-ancestors.*none' "$file"
            grep -qi '^x-content-type-options: nosniff' "$file"
            grep -qi '^x-frame-options: DENY' "$file"
            grep -qi '^referrer-policy: no-referrer' "$file"
            grep -qi '^permissions-policy:' "$file"
          }

          fetch_public root "$prod/"
          fetch_public status "$prod/status/"
          fetch_public landing_css "$prod/landing.css"
          fetch_public favicon "$prod/favicon.svg"
          fetch_public og "$prod/og-boqa.png"
          fetch_public health "$prod/health"

          cmp dashboard/index.html output/production-deploy/public/root
          cmp dashboard/status/index.html output/production-deploy/public/status
          cmp dashboard/landing.css output/production-deploy/public/landing_css
          cmp dashboard/favicon.svg output/production-deploy/public/favicon
          cmp dashboard/og-boqa.png output/production-deploy/public/og

          grep -F 'Codex proposes. BOQA verifies.' output/production-deploy/public/root >/dev/null
          grep -F 'MODEL_OUTPUT != AUTHORIZATION' output/production-deploy/public/root >/dev/null
          grep -F 'v1.5.1' output/production-deploy/public/root >/dev/null
          grep -F 'id="overall-state"' output/production-deploy/public/status >/dev/null

          for header_file in root status landing_css favicon og health; do
            assert_public_headers "output/production-deploy/headers/$header_file.txt"
          done

          api_health_status="$(curl -sS -D output/production-deploy/headers/api_health.txt -o output/production-deploy/public/api_health -w '%{http_code}' "$prod/api/health")"
          hunter_status="$(curl -sS -D output/production-deploy/headers/hunter_status.txt -o output/production-deploy/public/hunter_status -w '%{http_code}' "$prod/api/hunter/status")"
          case "$api_health_status" in 200|503|504) ;; *) echo "API_HEALTH_STATUS_UNEXPECTED=$api_health_status"; exit 1 ;; esac
          case "$hunter_status" in 200|503|504) ;; *) echo "HUNTER_STATUS_UNEXPECTED=$hunter_status"; exit 1 ;; esac
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" output/production-deploy/public/api_health
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" output/production-deploy/public/hunter_status
          assert_public_headers output/production-deploy/headers/api_health.txt
          assert_public_headers output/production-deploy/headers/hunter_status.txt

          private_status="$(curl --path-as-is -sS -D output/production-deploy/headers/private.txt -o output/production-deploy/public/private -w '%{http_code}' "$prod/api/private/billing")"
          encoded_private_status="$(curl --path-as-is -sS -o /dev/null -w '%{http_code}' "$prod/%2563obros.html")"
          post_public_status="$(curl -sS -X POST -o /dev/null -w '%{http_code}' "$prod/api/hunter/status")"
          test "$private_status" = "404"
          test "$encoded_private_status" = "404"
          test "$post_public_status" = "404"
          grep -qi "^content-security-policy: default-src 'none';" output/production-deploy/headers/private.txt
          grep -qi '^x-frame-options: DENY' output/production-deploy/headers/private.txt

          jq -n             --arg sha "$EXPECTED_SHA"             --arg version "$deployed_version"             --arg preview_version "$PREVIEW_VERSION_ID"             --arg preview_run "$PREVIEW_RUN_ID"             --arg preview_artifact "$PREVIEW_ARTIFACT_ID"             --arg api_health_status "$api_health_status"             --arg hunter_status "$hunter_status"             '{
              schema_version:3,
              canonical_main_sha:$sha,
              deployed_version_id:$version,
              verified_preview_version_id:$preview_version,
              source_preview_run_id:$preview_run,
              source_preview_artifact_id:$preview_artifact,
              deployment_mode:"verified-preview-version-100-percent",
              root_byte_equal:true,
              status_byte_equal:true,
              assets_byte_equal:true,
              public_security_headers_verified:true,
              private_surface_concealment_verified:true,
              public_api_read_only_verified:true,
              api_health_status:($api_health_status|tonumber),
              hunter_status:($hunter_status|tonumber),
              production_verified:true
            }' > output/production-deploy/evidence.json

          (
            cd output/production-deploy
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boqa-production-deploy-${{ inputs.expected_sha }}
          path: output/production-deploy/
          if-no-files-found: error
          retention-days: 30
