name: BOQA Production Deploy V1

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact canonical main SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: boqa-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_NAME: boqa
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact main identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_main="$(git ls-remote https://github.com/${REPO}.git refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_SHA"
          echo "CANONICAL_MAIN_SHA=$EXPECTED_SHA"

      - name: Resolve exact-head preview evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          runs="$(curl -fsSL "${auth[@]}" "$api/actions/workflows/boqa-cloudflare-preview-v6.yml/runs?head_sha=$EXPECTED_SHA&status=success&per_page=20")"
          run_id="$(jq -r '.workflow_runs | map(select(.head_sha == env.EXPECTED_SHA and .conclusion == "success")) | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
          test -n "$run_id"

          artifacts="$(curl -fsSL "${auth[@]}" "$api/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_id="$(jq -r '.artifacts | map(select(.expired == false and (.name | startswith("boqa-cloudflare-preview-v6-")))) | first | .id // empty' <<<"$artifacts")"
          test -n "$artifact_id"

          mkdir -p output/production-deploy/preview
          curl -fsSL -L "${auth[@]}" "$api/actions/artifacts/$artifact_id/zip" -o /tmp/preview.zip
          unzip -q /tmp/preview.zip -d output/production-deploy/preview

          candidate="$(find output/production-deploy/preview -name candidate.json -print -quit)"
          evidence="$(find output/production-deploy/preview -name preview-smoke-evidence.json -print -quit)"
          test -f "$candidate"
          test -f "$evidence"

          jq -e --arg sha "$EXPECTED_SHA" '
            .head_sha == $sha and
            .production_changed == false and
            .deploy_performed == false and
            (.version_id | type == "string") and
            (.preview_url | type == "string")
          ' "$candidate" >/dev/null

          jq -e '
            .gate_status == "PASS" and
            .production_changed == false and
            .deploy_performed == false
          ' "$evidence" >/dev/null

          version_id="$(jq -r '.version_id' "$candidate")"
          preview_url="$(jq -r '.preview_url' "$candidate")"
          {
            echo "PREVIEW_RUN_ID=$run_id"
            echo "PREVIEW_ARTIFACT_ID=$artifact_id"
            echo "VERSION_ID=$version_id"
            echo "PREVIEW_URL=$preview_url"
          } >> "$GITHUB_ENV"

      - name: Verify Cloudflare version before promotion
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?missing account id}"
          : "${CLOUDFLARE_API_TOKEN:?missing api token}"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          mkdir -p output/production-deploy
          curl -fsS "${auth[@]}" "$api/workers/workers/$WORKER_NAME/versions/$VERSION_ID" > output/production-deploy/version-before.json
          jq -e --arg id "$VERSION_ID" '.success == true and .result.id == $id' output/production-deploy/version-before.json >/dev/null

          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/deployments" > output/production-deploy/deployments-before.json

      - name: Promote exact verified version to production
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          body="$(jq -cn --arg version "$VERSION_ID" --arg sha "$EXPECTED_SHA" '{
            strategy:"percentage",
            versions:[{version_id:$version,percentage:100}],
            annotations:{
              "workers/message":("BOQA canonical "+$sha),
              "workers/triggered_by":"github-actions"
            }
          }')"

          curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -X POST -d "$body"             "$api/workers/scripts/$WORKER_NAME/deployments" > output/production-deploy/deployment-create.json
          jq -e --arg version "$VERSION_ID" '
            .success == true and
            (.result.versions | length == 1) and
            .result.versions[0].version_id == $version and
            .result.versions[0].percentage == 100
          ' output/production-deploy/deployment-create.json >/dev/null

      - name: Verify production surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          prod="https://boqa.simondalmasso44.workers.dev"
          mkdir -p output/production-deploy

          for _ in $(seq 1 30); do
            if curl -fsS "$prod/" -o output/production-deploy/root.html &&
               grep -F 'Codex proposes. BOQA verifies.' output/production-deploy/root.html >/dev/null &&
               grep -F 'MODEL_OUTPUT != AUTHORIZATION' output/production-deploy/root.html >/dev/null; then
              break
            fi
            sleep 2
          done
          grep -F 'Codex proposes. BOQA verifies.' output/production-deploy/root.html >/dev/null
          grep -F 'MODEL_OUTPUT != AUTHORIZATION' output/production-deploy/root.html >/dev/null

          curl -fsS "$prod/status/" -o output/production-deploy/status.html
          grep -F 'id="overall-state"' output/production-deploy/status.html >/dev/null
          grep -F 'Estado operativo' output/production-deploy/status.html >/dev/null

          curl -fsS "$prod/landing.css" -o /dev/null

          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          curl -fsS "${auth[@]}" "$api/workers/scripts/$WORKER_NAME/deployments" > output/production-deploy/deployments-after.json
          jq -e --arg version "$VERSION_ID" '
            .success == true and
            .result.deployments[0].versions[0].version_id == $version and
            .result.deployments[0].versions[0].percentage == 100
          ' output/production-deploy/deployments-after.json >/dev/null

          jq -n             --arg sha "$EXPECTED_SHA"             --arg version "$VERSION_ID"             --arg preview_run "$PREVIEW_RUN_ID"             --arg preview_artifact "$PREVIEW_ARTIFACT_ID"             '{
              schema_version:1,
              canonical_main_sha:$sha,
              deployed_version_id:$version,
              source_preview_run_id:$preview_run,
              source_preview_artifact_id:$preview_artifact,
              root_landing:true,
              status_preserved:true,
              production_verified:true
            }' > output/production-deploy/evidence.json

          find output/production-deploy -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > output/production-deploy/SHA256SUMS
          (cd output/production-deploy && sha256sum -c SHA256SUMS)

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boqa-production-deploy-${{ inputs.expected_sha }}
          path: output/production-deploy/
          if-no-files-found: error
          retention-days: 30
